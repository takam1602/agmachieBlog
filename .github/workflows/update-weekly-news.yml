name: Update weekly news

on:
  schedule:
    - cron: "0 15 * * 0" # Monday 00:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weekly-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update weekly news cache
        run: npm run update-weekly-news

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/.cache/weekly-news.json
          git diff --cached --quiet || git commit -m "Update weekly news cache"
          git push
